<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="PUSH 50">
<meta name="theme-color" content="#050505">
<title>PUSH 50 — iOS Liquid Glass</title>
<link rel="apple-touch-icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 180 180'><rect width='180' height='180' rx='40' fill='%23050505'/><circle cx='90' cy='90' r='68' fill='none' stroke='%23FFE600' stroke-width='8' opacity='0.25'/><text x='50%25' y='56%25' dominant-baseline='middle' text-anchor='middle' fill='%23FFE600' font-family='system-ui, -apple-system, sans-serif' font-weight='900' font-size='72'>50</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&family=Unbounded:wght@600;800;900&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #050505;
    --yellow: #FFE600;
    --yellow-glow: rgba(255, 230, 0, 0.35);
    --yellow-soft: rgba(255, 230, 0, 0.12);
    --glass: rgba(255, 255, 255, 0.055);
    --glass-strong: rgba(255, 255, 255, 0.09);
    --glass-border: rgba(255, 255, 255, 0.14);
    --text: #FFFFFF;
    --muted: rgba(255, 255, 255, 0.52);
    --font-display: 'Unbounded', -apple-system, BlinkMacSystemFont, sans-serif;
    --font-sans: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
    --font-mono: 'JetBrains Mono', monospace;
  }

  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    -webkit-tap-highlight-color: transparent;
    user-select: none;
  }

  body {
    background-color: var(--bg);
    color: var(--text);
    font-family: var(--font-sans);
    min-height: 100dvh;
    padding: calc(env(safe-area-inset-top, 20px) + 14px) 16px calc(env(safe-area-inset-bottom, 24px) + 24px);
    overflow-x: hidden;
    position: relative;
  }

  .ambient-orb {
    position: fixed;
    border-radius: 50%;
    filter: blur(85px);
    pointer-events: none;
    z-index: 0;
  }
  .orb-1 {
    width: 280px;
    height: 280px;
    background: rgba(255, 230, 0, 0.18);
    top: -60px;
    right: -70px;
  }
  .orb-2 {
    width: 240px;
    height: 240px;
    background: rgba(255, 200, 0, 0.1);
    bottom: 8%;
    left: -80px;
  }

  .app-shell {
    position: relative;
    z-index: 1;
    max-width: 480px;
    margin: 0 auto;
    display: flex;
    flex-direction: column;
    gap: 16px;
  }

  .glass-panel {
    background: linear-gradient(145deg, rgba(255,255,255,0.09) 0%, rgba(255,255,255,0.025) 100%);
    backdrop-filter: blur(28px) saturate(190%);
    -webkit-backdrop-filter: blur(28px) saturate(190%);
    border: 1px solid var(--glass-border);
    box-shadow:
      0 18px 40px rgba(0, 0, 0, 0.65),
      inset 0 1px 0 rgba(255, 255, 255, 0.25),
      inset 0 -1px 0 rgba(255, 255, 255, 0.04);
    border-radius: 28px;
    padding: 20px;
  }

  .top-bar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 14px 18px;
    border-radius: 24px;
  }
  .brand-title {
    font-family: var(--font-display);
    font-weight: 900;
    font-size: 16px;
    letter-spacing: 0.5px;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .brand-dot {
    width: 10px;
    height: 10px;
    border-radius: 50%;
    background: var(--yellow);
    box-shadow: 0 0 12px var(--yellow);
  }
  .bio-pill {
    font-family: var(--font-mono);
    font-size: 11px;
    color: var(--muted);
    background: rgba(255,255,255,0.05);
    padding: 6px 10px;
    border-radius: 999px;
    border: 1px solid rgba(255,255,255,0.1);
  }

  .hero-header {
    display: flex;
    justify-content: space-between;
    align-items: flex-end;
    margin-bottom: 14px;
  }
  .label-caps {
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 1.4px;
    color: var(--muted);
    font-weight: 600;
  }
  .big-number {
    font-family: var(--font-display);
    font-size: 42px;
    font-weight: 900;
    color: var(--yellow);
    line-height: 1;
    text-shadow: 0 0 24px var(--yellow-glow);
  }
  .big-number span {
    font-size: 18px;
    color: var(--muted);
    font-weight: 600;
  }
  .max-controls {
    display: flex;
    gap: 8px;
  }
  .btn-circle {
    width: 38px;
    height: 38px;
    border-radius: 50%;
    border: 1px solid var(--glass-border);
    background: rgba(255,255,255,0.07);
    color: #fff;
    font-family: var(--font-display);
    font-size: 18px;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    transition: transform 0.15s ease, background 0.2s;
  }
  .btn-circle:active {
    transform: scale(0.9);
    background: var(--yellow);
    color: #000;
  }

  .progress-track {
    height: 12px;
    background: rgba(255,255,255,0.07);
    border-radius: 999px;
    overflow: hidden;
    padding: 2px;
    border: 1px solid rgba(255,255,255,0.08);
  }
  .progress-fill {
    height: 100%;
    background: linear-gradient(90deg, #FFB800, var(--yellow));
    border-radius: 999px;
    box-shadow: 0 0 16px var(--yellow);
    transition: width 0.35s cubic-bezier(0.22, 1, 0.36, 1);
  }

  .sets-grid {
    display: grid;
    grid-template-columns: repeat(5, 1fr);
    gap: 8px;
    margin-top: 16px;
  }
  .set-pill {
    background: rgba(255,255,255,0.045);
    border: 1px solid rgba(255,255,255,0.11);
    border-radius: 20px;
    padding: 14px 4px;
    text-align: center;
    cursor: pointer;
    transition: all 0.2s ease;
  }
  .set-pill .set-idx {
    font-size: 10px;
    color: var(--muted);
    margin-bottom: 4px;
    font-family: var(--font-mono);
  }
  .set-pill .set-reps {
    font-family: var(--font-display);
    font-size: 18px;
    font-weight: 800;
  }
  .set-pill.done {
    background: var(--yellow);
    color: #050505;
    border-color: var(--yellow);
    box-shadow: 0 8px 22px var(--yellow-glow);
    transform: translateY(-2px);
  }
  .set-pill.done .set-idx {
    color: rgba(0,0,0,0.6);
    font-weight: 700;
  }

  .timer-bar {
    margin-top: 14px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    background: rgba(0,0,0,0.45);
    border: 1px solid rgba(255,255,255,0.1);
    padding: 10px 14px;
    border-radius: 18px;
  }
  .timer-display {
    font-family: var(--font-mono);
    font-size: 18px;
    font-weight: 700;
    color: var(--yellow);
  }
  .btn-small {
    background: rgba(255, 230, 0, 0.14);
    color: var(--yellow);
    border: 1px solid rgba(255, 230, 0, 0.35);
    padding: 6px 12px;
    border-radius: 12px;
    font-size: 12px;
    font-weight: 600;
    cursor: pointer;
  }

  .habit-list {
    display: flex;
    flex-direction: column;
    gap: 10px;
    margin-top: 12px;
  }
  .habit-item {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 14px 16px;
    background: rgba(255,255,255,0.04);
    border: 1px solid rgba(255,255,255,0.09);
    border-radius: 18px;
    cursor: pointer;
    transition: all 0.2s ease;
  }
  .habit-left {
    display: flex;
    align-items: center;
    gap: 12px;
    font-size: 14px;
    font-weight: 500;
  }
  .check-ring {
    width: 22px;
    height: 22px;
    border-radius: 50%;
    border: 2px solid rgba(255,255,255,0.3);
    display: flex;
    align-items: center;
    justify-content: center;
    transition: all 0.2s ease;
  }
  .habit-item.completed {
    border-color: rgba(255, 230, 0, 0.45);
    background: rgba(255, 230, 0, 0.08);
  }
  .habit-item.completed .check-ring {
    background: var(--yellow);
    border-color: var(--yellow);
    color: #000;
    box-shadow: 0 0 10px var(--yellow-glow);
  }

  .chart-bars {
    display: grid;
    grid-template-columns: repeat(7, 1fr);
    gap: 10px;
    height: 120px;
    align-items: end;
    margin-top: 18px;
    padding-top: 10px;
  }
  .bar-col {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 6px;
    height: 100%;
    justify-content: flex-end;
    cursor: pointer;
  }
  .bar-val {
    font-family: var(--font-mono);
    font-size: 10px;
    color: var(--muted);
  }
  .bar-track {
    width: 100%;
    height: 82px;
    background: rgba(255,255,255,0.05);
    border-radius: 12px;
    display: flex;
    align-items: flex-end;
    padding: 3px;
    border: 1px solid rgba(255,255,255,0.07);
  }
  .bar-fill {
    width: 100%;
    background: rgba(255,255,255,0.22);
    border-radius: 9px;
    transition: height 0.3s ease, background 0.2s;
  }
  .bar-col.active .bar-fill {
    background: var(--yellow);
    box-shadow: 0 0 14px var(--yellow-glow);
  }
  .bar-day {
    font-size: 11px;
    font-weight: 600;
    color: var(--muted);
  }
  .bar-col.active .bar-day {
    color: var(--yellow);
  }
</style>
</head>
<body>
  <div class="ambient-orb orb-1"></div>
  <div class="ambient-orb orb-2"></div>

  <main class="app-shell">
    <header class="glass-panel top-bar">
      <div class="brand-title">
        <span class="brand-dot"></span>
        PUSH 50
      </div>
      <div class="bio-pill">180 СМ · 72 КГ · ИМТ 22.2</div>
    </header>

    <section class="glass-panel">
      <div class="hero-header">
        <div>
          <div class="label-caps">Текущий максимум за раз</div>
          <div class="big-number" id="maxDisplay">20 <span>/ 50</span></div>
        </div>
        <div class="max-controls">
          <button class="btn-circle" onclick="changeMax(-1)">−</button>
          <button class="btn-circle" onclick="changeMax(1)">+</button>
        </div>
      </div>

      <div class="progress-track">
        <div class="progress-fill" id="maxProgress" style="width: 40%;"></div>
      </div>

      <div style="display:flex; justify-content:space-between; margin-top:16px; align-items:center;">
        <span class="label-caps">План на сегодня (5 подходов)</span>
        <span class="bio-pill" id="todayTotalBadge">0 / 71 повт.</span>
      </div>

      <div class="sets-grid" id="setsContainer"></div>

      <div class="timer-bar">
        <div>
          <div class="label-caps" style="font-size:9px;">Таймер отдыха</div>
          <div class="timer-display" id="timerText">01:30</div>
        </div>
        <button class="btn-small" onclick="startRestTimer(90)">Старт 90 сек</button>
      </div>
    </section>

    <section class="glass-panel">
      <div class="label-caps">Цели на день</div>
      <div class="habit-list" id="habitsContainer"></div>
    </section>

    <section class="glass-panel">
      <div style="display:flex; justify-content:space-between; align-items:center;">
        <span class="label-caps">Объем за неделю (повторения)</span>
        <span class="bio-pill" id="streakBadge">🔥 Серия: 1 дн.</span>
      </div>
      <div class="chart-bars" id="chartContainer"></div>
    </section>
  </main>

<script>
  const STORAGE_KEY = 'push50_ios_state_v1';
  const DAYS = ['Пн', 'Вт', 'Ср', 'Чт', 'Пт', 'Сб', 'Вс'];

  const defaultState = {
    maxReps: 20,
    activeDay: (new Date().getDay() + 6) % 7,
    setsDone: [false, false, false, false, false],
    habits: [
      { id: 1, title: 'Выполнить все 5 подходов отжиманий', done: false },
      { id: 2, title: 'Белок в рационе (минимум 115 г на 72 кг)', done: false },
      { id: 3, title: 'Разминка плеч и запястий (5 мин)', done: false }
    ],
    weekVolume: [65, 0, 72, 0, 75, 0, 0]
  };

  let state = JSON.parse(localStorage.getItem(STORAGE_KEY)) || defaultState;
  let timerInterval = null;

  function saveState() {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
  }

  function getMultipliers(max) {
    return [0.7, 0.8, 0.65, 0.65, 0.75].map(m => Math.max(5, Math.round(max * m)));
  }

  function changeMax(delta) {
    state.maxReps = Math.min(50, Math.max(5, state.maxReps + delta));
    saveState();
    render();
  }

  function toggleSet(idx) {
    state.setsDone[idx] = !state.setsDone[idx];
    const repsList = getMultipliers(state.maxReps);
    const totalDone = repsList.reduce((acc, r, i) => acc + (state.setsDone[i] ? r : 0), 0);
    state.weekVolume[state.activeDay] = totalDone;

    if (state.setsDone.every(Boolean)) {
      state.habits[0].done = true;
    }
    if (state.setsDone[idx]) {
      startRestTimer(90);
    }
    saveState();
    render();
  }

  function toggleHabit(idx) {
    state.habits[idx].done = !state.habits[idx].done;
    saveState();
    render();
  }

  function selectDay(dayIdx) {
    state.activeDay = dayIdx;
    saveState();
    render();
  }

  function startRestTimer(seconds) {
    clearInterval(timerInterval);
    let remaining = seconds;
    const el = document.getElementById('timerText');
    const updateText = () => {
      const m = String(Math.floor(remaining / 60)).padStart(2, '0');
      const s = String(remaining % 60).padStart(2, '0');
      el.textContent = `${m}:${s}`;
    };
    updateText();
    timerInterval = setInterval(() => {
      remaining--;
      if (remaining <= 0) {
        clearInterval(timerInterval);
        el.textContent = 'ГОТОВО!';
        return;
      }
      updateText();
    }, 1000);
  }

  function render() {
    document.getElementById('maxDisplay').innerHTML = `${state.maxReps} <span>/ 50</span>`;
    const pct = Math.min(100, Math.round((state.maxReps / 50) * 100));
    document.getElementById('maxProgress').style.width = pct + '%';

    const repsList = getMultipliers(state.maxReps);
    const totalTarget = repsList.reduce((a, b) => a + b, 0);
    const totalDone = repsList.reduce((acc, r, i) => acc + (state.setsDone[i] ? r : 0), 0);
    document.getElementById('todayTotalBadge').textContent = `${totalDone} / ${totalTarget} повт.`;

    const setsEl = document.getElementById('setsContainer');
    setsEl.innerHTML = '';
    repsList.forEach((reps, i) => {
      const pill = document.createElement('div');
      pill.className = 'set-pill' + (state.setsDone[i] ? ' done' : '');
      pill.onclick = () => toggleSet(i);
      pill.innerHTML = `<div class="set-idx">СЕТ ${i + 1}</div><div class="set-reps">${reps}</div>`;
      setsEl.appendChild(pill);
    });

    const habitsEl = document.getElementById('habitsContainer');
    habitsEl.innerHTML = '';
    state.habits.forEach((h, i) => {
      const row = document.createElement('div');
      row.className = 'habit-item' + (h.done ? ' completed' : '');
      row.onclick = () => toggleHabit(i);
      row.innerHTML = `
        <div class="habit-left">
          <div class="check-ring">${h.done ? '✓' : ''}</div>
          <span>${h.title}</span>
        </div>
      `;
      habitsEl.appendChild(row);
    });

    const chartEl = document.getElementById('chartContainer');
    chartEl.innerHTML = '';
    const maxVol = Math.max(100, ...state.weekVolume);
    let activeDaysCount = 0;
    state.weekVolume.forEach((vol, i) => {
      if (vol > 0) activeDaysCount++;
      const hPct = Math.max(8, Math.round((vol / maxVol) * 100));
      const col = document.createElement('div');
      col.className = 'bar-col' + (i === state.activeDay ? ' active' : '');
      col.onclick = () => selectDay(i);
      col.innerHTML = `
        <div class="bar-val">${vol}</div>
        <div class="bar-track"><div class="bar-fill" style="height:${hPct}%"></div></div>
        <div class="bar-day">${DAYS[i]}</div>
      `;
      chartEl.appendChild(col);
    });

    document.getElementById('streakBadge').textContent = `🔥 Активных дней: ${activeDaysCount}`;
  }

  render();
</script>
</body>
</html>
